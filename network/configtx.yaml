# ==========================================================================
#  VERITY — Fabric channel configuration
#
#  Whitepaper basis:
#    §4.1  Ordering service: SmartBFT. Ordering organisations are Central
#          Authority, two Regulatory Council seats and two rotating bank
#          seats — five nodes, so BFT (n >= 3f+1) tolerates f = 1.
#    §4.2  Channels: commitment, exposure, claims.
#    §4.5  Central Authority holds endorsement and querying rights on every
#          channel FROM GENESIS and cannot be voted out by participating banks.
#
#  Generate a channel genesis block:
#    configtxgen -profile VerityCommitment -outputBlock ./channel-artifacts/commitment.block -channelID commitment
# ==========================================================================

################################################################################
#   ORGANIZATIONS
################################################################################
Organizations:

  # ---- Ordering organisations (5) — §4.1 ----------------------------------
  # These order transactions. They never read application data (§4.4 Table 3:
  # "order only, no read").

  - &OrdererBB
    Name: OrdererBBMSP
    ID: OrdererBBMSP
    MSPDir: organizations/ordererOrganizations/ord-bb.verity.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererBBMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererBBMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererBBMSP.admin')"
    OrdererEndpoints:
      - orderer0.ord-bb.verity.local:7050

  - &OrdererCouncil
    Name: OrdererCouncilMSP
    ID: OrdererCouncilMSP
    MSPDir: organizations/ordererOrganizations/ord-bibm.verity.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererCouncilMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererCouncilMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererCouncilMSP.admin')"
    OrdererEndpoints:
      - orderer1.ord-bibm.verity.local:7051

  - &OrdererFRC
    Name: OrdererRegulatoryCouncilMSP
    ID: OrdererRegulatoryCouncilMSP
    MSPDir: organizations/ordererOrganizations/ord-frc.verity.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererRegulatoryCouncilMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererRegulatoryCouncilMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererRegulatoryCouncilMSP.admin')"
    OrdererEndpoints:
      - orderer2.ord-frc.verity.local:7052

  # The two rotating bank seats. §4.1: "The two bank seats are drawn from the
  # supervised population, so simultaneous defection would exceed the model;
  # the seats therefore rotate on a fixed Council schedule."
  - &OrdererSeatA
    Name: OrdererSeatAMSP
    ID: OrdererSeatAMSP
    MSPDir: organizations/ordererOrganizations/ord-seata.verity.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererSeatAMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererSeatAMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererSeatAMSP.admin')"
    OrdererEndpoints:
      - orderer3.ord-seata.verity.local:7053

  - &OrdererSeatB
    Name: OrdererSeatBMSP
    ID: OrdererSeatBMSP
    MSPDir: organizations/ordererOrganizations/ord-seatb.verity.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererSeatBMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererSeatBMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererSeatBMSP.admin')"
    OrdererEndpoints:
      - orderer4.ord-seatb.verity.local:7054

  # ---- Peer organisations (4) — §4.2 --------------------------------------

  # Bank A Islami Bank PLC — the resolution entity, Phase 1 participant (§6).
  - &BankA
    Name: BankAMSP
    ID: BankAMSP
    MSPDir: organizations/peerOrganizations/banka.verity.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('BankAMSP.admin', 'BankAMSP.peer', 'BankAMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('BankAMSP.admin', 'BankAMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('BankAMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('BankAMSP.peer')"
    AnchorPeers:
      - Host: peer0.banka.verity.local
        Port: 9051

  # Bank B Bank — synthetic second institution. Required to make Module II
  # (cross-bank aggregation) and the private-data privacy demo real.
  - &BankB
    Name: BankBMSP
    ID: BankBMSP
    MSPDir: organizations/peerOrganizations/bankb.verity.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('BankBMSP.admin', 'BankBMSP.peer', 'BankBMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('BankBMSP.admin', 'BankBMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('BankBMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('BankBMSP.peer')"
    AnchorPeers:
      - Host: peer0.bankb.verity.local
        Port: 9061

  # Central Authority — the supervisor. Endorses every lifecycle event (§3.8 step 4).
  - &CentralAuthority
    Name: CentralAuthorityMSP
    ID: CentralAuthorityMSP
    MSPDir: organizations/peerOrganizations/bb.verity.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CentralAuthorityMSP.admin', 'CentralAuthorityMSP.peer', 'CentralAuthorityMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('CentralAuthorityMSP.admin', 'CentralAuthorityMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('CentralAuthorityMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('CentralAuthorityMSP.peer')"
    AnchorPeers:
      - Host: peer0.bb.verity.local
        Port: 9071

  # Financial Reporting Council — query peer only. §4.4 Table 3: read all,
  # borrower identity NEVER.
  - &RegulatoryCouncil
    Name: RegulatoryCouncilMSP
    ID: RegulatoryCouncilMSP
    MSPDir: organizations/peerOrganizations/frc.verity.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('RegulatoryCouncilMSP.admin', 'RegulatoryCouncilMSP.peer', 'RegulatoryCouncilMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('RegulatoryCouncilMSP.admin', 'RegulatoryCouncilMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('RegulatoryCouncilMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('RegulatoryCouncilMSP.peer')"
    AnchorPeers:
      - Host: peer0.frc.verity.local
        Port: 9081

################################################################################
#   CAPABILITIES
################################################################################
Capabilities:
  Channel: &ChannelCapabilities
    V3_0: true          # required for BFT ordering
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true          # required for purge of private data (§3.7 immutability note)

################################################################################
#   APPLICATION
################################################################################
Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

################################################################################
#   ORDERER — SmartBFT (§4.1)
################################################################################
Orderer: &OrdererDefaults
  OrdererType: BFT

  # NO global `Addresses:` list here. Under the V3_0 channel capability Fabric
  # rejects it outright:
  #
  #   "global orderer endpoints exist, but can not be used with V3_0 capability"
  #
  # Endpoints are declared per organisation instead, as `OrdererEndpoints` on
  # each of the five ordering orgs above. That is the v3 model: an endpoint
  # belongs to the organisation that operates the node, not to the channel.

  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB

  # SmartBFT tuning. Exactly the field set Fabric 3.1.1 ships in its own
  # config/configtx.yaml BFT profile — written out so the values are auditable
  # rather than implicit. Fields outside this set are not accepted by every
  # 3.x build; omitted fields fall back to Fabric's defaults.
  SmartBFT:
    RequestBatchMaxInterval: 200ms
    RequestForwardTimeout: 5s
    RequestComplainTimeout: 20s
    RequestAutoRemoveTimeout: 3m0s
    ViewChangeResendInterval: 5s
    ViewChangeTimeout: 20s
    LeaderHeartbeatTimeout: 1m0s
    LeaderHeartbeatCount: 10
    CollectTimeout: 1s
    IncomingMessageBufferSize: 200
    RequestPoolSize: 100000

  # The five consenters. n = 5, BFT tolerates f = 1 (n >= 3f+1).
  # Expansion to seven organisations raises tolerance to f = 2 (§4.1).
  ConsenterMapping:
    - ID: 1
      Host: orderer0.ord-bb.verity.local
      Port: 7050
      MSPID: OrdererBBMSP
      Identity: organizations/ordererOrganizations/ord-bb.verity.local/orderers/orderer0.ord-bb.verity.local/msp/signcerts/cert.pem
      ClientTLSCert: organizations/ordererOrganizations/ord-bb.verity.local/orderers/orderer0.ord-bb.verity.local/tls/server.crt
      ServerTLSCert: organizations/ordererOrganizations/ord-bb.verity.local/orderers/orderer0.ord-bb.verity.local/tls/server.crt
    - ID: 2
      Host: orderer1.ord-bibm.verity.local
      Port: 7051
      MSPID: OrdererCouncilMSP
      Identity: organizations/ordererOrganizations/ord-bibm.verity.local/orderers/orderer1.ord-bibm.verity.local/msp/signcerts/cert.pem
      ClientTLSCert: organizations/ordererOrganizations/ord-bibm.verity.local/orderers/orderer1.ord-bibm.verity.local/tls/server.crt
      ServerTLSCert: organizations/ordererOrganizations/ord-bibm.verity.local/orderers/orderer1.ord-bibm.verity.local/tls/server.crt
    - ID: 3
      Host: orderer2.ord-frc.verity.local
      Port: 7052
      MSPID: OrdererRegulatoryCouncilMSP
      Identity: organizations/ordererOrganizations/ord-frc.verity.local/orderers/orderer2.ord-frc.verity.local/msp/signcerts/cert.pem
      ClientTLSCert: organizations/ordererOrganizations/ord-frc.verity.local/orderers/orderer2.ord-frc.verity.local/tls/server.crt
      ServerTLSCert: organizations/ordererOrganizations/ord-frc.verity.local/orderers/orderer2.ord-frc.verity.local/tls/server.crt
    - ID: 4
      Host: orderer3.ord-seata.verity.local
      Port: 7053
      MSPID: OrdererSeatAMSP
      Identity: organizations/ordererOrganizations/ord-seata.verity.local/orderers/orderer3.ord-seata.verity.local/msp/signcerts/cert.pem
      ClientTLSCert: organizations/ordererOrganizations/ord-seata.verity.local/orderers/orderer3.ord-seata.verity.local/tls/server.crt
      ServerTLSCert: organizations/ordererOrganizations/ord-seata.verity.local/orderers/orderer3.ord-seata.verity.local/tls/server.crt
    - ID: 5
      Host: orderer4.ord-seatb.verity.local
      Port: 7054
      MSPID: OrdererSeatBMSP
      Identity: organizations/ordererOrganizations/ord-seatb.verity.local/orderers/orderer4.ord-seatb.verity.local/msp/signcerts/cert.pem
      ClientTLSCert: organizations/ordererOrganizations/ord-seatb.verity.local/orderers/orderer4.ord-seatb.verity.local/tls/server.crt
      ServerTLSCert: organizations/ordererOrganizations/ord-seatb.verity.local/orderers/orderer4.ord-seatb.verity.local/tls/server.crt

  Organizations:

  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    # BlockValidation specifies what signatures a peer requires on a block
    # before accepting it.
    #
    # This stays ImplicitMeta even under BFT. There is no `ImplicitOrderer` /
    # `SMARTBFT` policy type in configtx — configtxgen rejects it with
    # "unknown policy type: ImplicitOrderer". Fabric applies SmartBFT's own
    # block-signature rules internally once OrdererType is BFT; the channel
    # policy does not restate them. Matches config/configtx.yaml as shipped
    # with the Fabric 3.1.1 binaries.
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

################################################################################
#   CHANNEL DEFAULTS
################################################################################
Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

################################################################################
#   PROFILES — one per channel (§4.2)
################################################################################
Profiles:

  # commitment — lifecycle events, authority evidence, governance parameters,
  # access log. All four peer organisations.
  VerityCommitment:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererBB
        - *OrdererCouncil
        - *OrdererFRC
        - *OrdererSeatA
        - *OrdererSeatB
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *BankA
        - *BankB
        - *CentralAuthority
        - *RegulatoryCouncil
      Capabilities: *ApplicationCapabilities

  # exposure — Paillier ciphertexts, group-token attestations, aggregates.
  # Regulatory Council is NOT a member: §4.4 Table 3 gives Regulatory Council no access to exposure ciphertexts.
  VerityExposure:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererBB
        - *OrdererCouncil
        - *OrdererFRC
        - *OrdererSeatA
        - *OrdererSeatB
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *BankA
        - *BankB
        - *CentralAuthority
      Capabilities: *ApplicationCapabilities

  # claims — liability roots and claim tokens.
  # BankB is NOT a member: only the resolution entity issues claims (§6 Phase 1).
  VerityClaims:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererBB
        - *OrdererCouncil
        - *OrdererFRC
        - *OrdererSeatA
        - *OrdererSeatB
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *BankA
        - *CentralAuthority
        - *RegulatoryCouncil
      Capabilities: *ApplicationCapabilities
